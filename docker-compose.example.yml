name: vault-cockpit

networks:
  proxy:
    external: true

services:
  vault-cockpit:
    image: ghcr.io/rubenvitt/vault-cockpit:latest
    container_name: vault-cockpit
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - TZ=Europe/Berlin
      - VAULT_PATH=/vault
      - INDEX_DB=/data/index.db
      - POLICY_FILE=/config/policy.json
      - PORT=3000
      - TRUST_PROXY=true
      - REINDEX_INTERVAL_MIN=15
    volumes:
      # Beschreibbar, damit vault_edit, vault_append und vault_set_frontmatter
      # bestehende Notizen ändern können. Der Container läuft als uid 1000 (node)
      # und braucht Schreibrechte auf die Notizdateien.
      - /pfad/zum/vault:/vault:rw
      # Ohne Bearbeiten stattdessen: Vault read-only und nur den Quick-Capture-
      # Ordner beschreibbar darüber — dann erzwingt das Dateisystem die
      # Schreibgrenze, nicht nur der Anwendungscode.
      #   - /pfad/zum/vault:/vault:ro
      #   - /pfad/zum/vault/inbox:/vault/inbox:rw
      - ./policy.json:/config/policy.json:ro
      - ./data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault-cockpit.entrypoints=https"
      - "traefik.http.routers.vault-cockpit.rule=Host(`mcp.example.com`)"
      - "traefik.http.routers.vault-cockpit.tls.certresolver=letsencrypt"
      # Bewusst OHNE gzip- und buffering-Middleware: beides bricht
      # Streamable-HTTP/SSE-Antworten des MCP-Transports.
      - "traefik.http.services.vault-cockpit.loadbalancer.server.port=3000"
