name: iOS

# Baut und testet die iOS-App auf dem Simulator, ohne Signieren.
# `ios-test` ist ein Pflicht-Check für main. Er meldet sich deshalb bei jedem PR: Ohne Änderung
# unter ios/ wird er übersprungen, und ein übersprungener Job gilt als bestanden.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = push ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(ios/|\.github/workflows/ios\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios-test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      # Der Makefile wählt das erste verfügbare iPhone als Simulator.
      - run: make -C ios test
