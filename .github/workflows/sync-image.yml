name: Sync-Image

# Sidecar vault-sync (Obsidian Headless). Baut nur, wenn sich sync/ ändert,
# um CI-Minuten zu sparen. Der Tag ist die gepinnte Client-Version aus
# sync/Dockerfile; docker-compose.example.yml verweist auf genau diesen Tag.
on:
  push:
    branches: [main]
    paths:
      - 'sync/**'
      - '.github/workflows/sync-image.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Client-Version lesen
        id: version
        run: echo "version=$(sed -n 's/^ARG OBSIDIAN_HEADLESS_VERSION=//p' sync/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sync
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-sync:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-sync:${{ github.sha }}
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync
