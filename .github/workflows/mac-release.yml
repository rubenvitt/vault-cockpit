name: macOS-Release

# Direktvertrieb der macOS-App (Mac Catalyst) über GitHub-Releases, ohne App Store: Jeder Push auf
# main, der die App ändert (ios/ ohne Markdown), gibt eine neue Version mit der notarisierten
# `Cockpit.dmg` zum Installieren und `Cockpit-mac-X.Y.Z.zip` für das Update in der App (MacUpdater).
# Beides liegt im mitlaufenden Release `macos`, das jede Version ersetzt (fester Link
# …/releases/download/macos/Cockpit.dmg); die Versionen stehen als Git-Tags `mac/vX.Y.Z` (ohne Release).
# Tag ohne Ziffern und Vorabversion, damit BRAT das Release nie als Obsidian-Plugin wählt: BRAT liest
# die Version aus jedem Release-Tag (semver.coerce), sortiert Tags ohne Version ans Ende und nimmt
# ohne Beta-Modus keine Vorabversionen.
# Die Version folgt den Commits wie semantic-release (ios/scripts/mac-release.js): feat → Minor,
# `!`/BREAKING CHANGE → Major, sonst Patch. Manuell gestartet gibt es auch ohne neue Commits ein
# Patch-Release (z. B. nach einem gescheiterten Lauf; ohne Release bleibt die Version frei).
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - '.github/workflows/mac-release.yml'
  workflow_dispatch:

# Ein Release nach dem anderen, sonst rechnen zwei Läufe dieselbe Version aus.
concurrency:
  group: mac-release
  cancel-in-progress: false

# Standard nur lesen; Release und Tags schreibt allein der Job `release`.
permissions:
  contents: read

jobs:
  version:
    # Nur von main: Ein manueller Lauf auf einem anderen Branch würde sonst ungeprüften Code als
    # neueste Version veröffentlichen, die jede installierte App als Update anbietet.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - id: plan
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: node ios/scripts/mac-release.js
      - if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: API-Key ablegen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key")
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      # Wie beim TestFlight-Upload: Das automatische Signieren legt ein Entwicklungszertifikat an.
      - name: Alte CI-Zertifikate widerrufen
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node ios/scripts/certificates-cleanup.js
      - name: Bauen, signieren (Developer ID), notarisieren
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional; ohne signiert der Export mit dem von Apple verwalteten Developer-ID-Zertifikat.
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: ios/scripts/mac-direct.sh
      # Vor dem Veröffentlichen, damit jede Version an genau einem Commit hängt: Scheitert dieser
      # Schritt, ist nichts veröffentlicht, und der nächste Lauf nimmt dieselbe Version neu. Scheitert
      # danach das Veröffentlichen, setzt „Re-run failed jobs“ es mit demselben Commit fort (der Tag
      # steht schon, der Push ist dann ein No-op); ein neuer Push zählt ab hier die nächste Version.
      - name: Versions-Tag setzen
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      # Reihenfolge, damit Titel und Archiv in jedem Zwischenstand zusammenpassen, auch bei einer
      # Wiederholung: neues Archiv `Cockpit-mac-X.Y.Z.zip` hochladen (das alte bleibt; ein schon
      # vorhandenes dieser Version bleibt unangetastet), Titel ändern, erst dann alte Archive
      # löschen. Die App lädt das Archiv zur Version im Titel. Das Release wird ersetzt, nicht
      # gelöscht, damit der Link auf Cockpit.dmg bleibt.
      - name: Release `macos` ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Cockpit-mac-$VERSION.zip"
          files=(ios/build/mac-direct/Cockpit.dmg "ios/build/mac-direct/$zip")
          title="Cockpit für macOS $VERSION"
          api="repos/$GITHUB_REPOSITORY/releases"
          if gh release view macos > /dev/null 2>&1; then
            # Nie auf eine ältere Version zurück (z. B. „Re-run failed jobs“ eines alten Laufs, nachdem
            # schon eine neuere veröffentlicht ist): Version im Titel lesen und vergleichen.
            current="$(gh release view macos --json name -q .name | { grep -oE '[0-9]+[.][0-9]+[.][0-9]+' || true; } | tail -n 1)"
            if [ -n "$current" ] && [ "$current" != "$VERSION" ] \
              && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
              echo "::error::Das Release macos hat schon $current, neuer als $VERSION; nichts veröffentlicht."
              exit 1
            fi
            git tag -f macos "$GITHUB_SHA"
            git push -f origin refs/tags/macos
            # DMG unter einem Zwischennamen hochladen, dann die alte löschen und die neue umbenennen:
            # Scheitert der Upload, bleibt die alte Cockpit.dmg hinter dem festen Link.
            cp ios/build/mac-direct/Cockpit.dmg "$RUNNER_TEMP/Cockpit-neu.dmg"
            gh release upload macos "$RUNNER_TEMP/Cockpit-neu.dmg" --clobber
            assets="$(gh api "$api/tags/macos" --jq '.assets[] | "\(.id) \(.name)"')"
            old_dmg="$(awk '$2 == "Cockpit.dmg" { print $1 }' <<< "$assets")"
            new_dmg="$(awk '$2 == "Cockpit-neu.dmg" { print $1 }' <<< "$assets")"
            [ -n "$new_dmg" ] || { echo "Cockpit-neu.dmg fehlt nach dem Upload" >&2; exit 1; }
            if [ -n "$old_dmg" ]; then gh api -X DELETE "$api/assets/$old_dmg"; fi
            gh api -X PATCH "$api/assets/$new_dmg" -f name=Cockpit.dmg > /dev/null
            # Archiv dieser Version schon vollständig da (Wiederholung nach einem Abbruch): stehen
            # lassen, sonst löschte --clobber es vor dem Upload, und scheitert der, fehlte das
            # Archiv zum Titel. Ein unvollständiger Upload (state ≠ uploaded) wird ersetzt.
            # Abfrage für sich: Scheitert sie, bricht der Lauf ab (bash -e), statt wie bei
            # „Archiv fehlt“ mit --clobber hochzuladen.
            uploaded="$(gh release view macos --json assets -q '.assets[] | select(.state == "uploaded") | .name')"
            if ! grep -qxF "$zip" <<< "$uploaded"; then
              gh release upload macos "ios/build/mac-direct/$zip" --clobber
            fi
            gh release edit macos --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
            gh release view macos --json assets -q '.assets[].name' \
              | { grep -E '^Cockpit-mac-.*[.]zip$' || true; } | { grep -vxF "$zip" || true; } \
              | while read -r old; do gh release delete-asset macos "$old" --yes; done
          else
            gh release create macos "${files[@]}" --target "$GITHUB_SHA" --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          fi
          echo "### $title" >> "$GITHUB_STEP_SUMMARY"
          gh release view macos --json url -q .url >> "$GITHUB_STEP_SUMMARY"
      - name: Zertifikat dieses Laufs widerrufen
        if: always()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node ios/scripts/certificates-cleanup.js
      - name: API-Key löschen
        if: always()
        run: rm -f "$ASC_KEY_PATH"
