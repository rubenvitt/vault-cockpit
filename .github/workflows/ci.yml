name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Der Server holt das Deployment selbst ab (Pull, kein Runner mit Zugang zum Host):
  # ~/server/deploy-agent setzt payload.tag als Image-Tag und meldet success/failure zurück.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Deployment anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" --jq .id --input - <<JSON
          {"ref": "${{ github.sha }}", "environment": "production", "auto_merge": false,
           "required_contexts": [], "payload": {"tag": "${{ github.sha }}"},
           "description": "Image ghcr.io/${{ github.repository }}:${{ github.sha }}"}
          JSON
          )
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -f state=queued \
            -f description="wartet auf den deploy-agent des Servers" > /dev/null
          echo "Deployment $id angelegt"
